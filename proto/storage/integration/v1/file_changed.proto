syntax = "proto3";

package storage.integration.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/contracts/gen/go/storage/integration/v1;storageintegrationv1";

// OwnerFact is one condition of the Directory's owner with its value.
message OwnerFact {
  // The condition's name, such as "file_home".
  string condition = 1;
  // The value the locating caller supplied.
  string value = 2;
}

// Directory identifies the Directory a file changed in: its owner, as the
// locating caller's facts in condition order, and its name.
message Directory {
  // Owner facts ordered by condition name.
  repeated OwnerFact owner = 1;
  // Name within the owner.
  string name = 2;
}

// FileOperation is how a file Storage wrote changed.
enum FileOperation {
  // Unspecified operation; never published.
  FILE_OPERATION_UNSPECIFIED = 0;
  // A file was created at a free name: an Attachment uploaded or an Artifact
  // published.
  FILE_OPERATION_CREATED = 1;
  // A file's content was replaced at its name.
  FILE_OPERATION_REPLACED = 2;
  // A file moved to a new name.
  FILE_OPERATION_RENAMED = 3;
  // A file was deleted.
  FILE_OPERATION_DELETED = 4;
}

// FileChangedV1 is the File Change Published Fact: one committed change of a
// file Storage carried out, published best-effort. It names the Directory by
// its owner and name, which each subscriber claims or ignores, and names the
// file but carries no content. Changes a Harness makes through a mount are
// never published. Exactly one of actor_user_id, actor_application_id and
// actor_work_id is set.
message FileChangedV1 {
  reserved 3, 4;
  reserved "owner", "kind";
  // Unique identity of this publication and of the change.
  string event_id = 1;
  // Time the change was committed.
  google.protobuf.Timestamp occurred_at = 2;
  // The Directory the file is in.
  Directory directory = 10;
  // The file's name after the change; for a deletion, the name it had.
  string name = 5;
  // The former name of a renamed file; empty otherwise.
  string previous_name = 6;
  // How the file changed.
  FileOperation operation = 7;
  // The person who made the change.
  string actor_user_id = 8;
  // The Work whose Agent made the change.
  string actor_work_id = 9;
  // The Application that made the change.
  string actor_application_id = 11;
}
