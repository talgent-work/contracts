syntax = "proto3";

package storage.private.v1;

import "google/protobuf/timestamp.proto";
import "storage/private/v1/storage.proto";

option go_package = "github.com/talgent-work/contracts/gen/go/storage/private/v1;storageprivatev1";

// SandboxMountService is the Sandbox Mount, Workspace View Query and Work
// Reclamation Intent Contracts; only Agent calls it.
service SandboxMountService {
  // AcquireMounts opens each requested located Directory, completing its
  // allocation, prepares the mount points named inside it with every parent
  // owned by the sandbox user, and returns one Mount Grant per Directory in
  // request order. A Mount Grant is issued, never held: there is no unmount.
  // A reclaimed Directory refuses with DIRECTORY_RECLAIMED. A read-write
  // request for a Directory mapped into the Mapped View refuses with
  // DIRECTORY_MAPPED; a granted read-write mount keeps the Directory from
  // ever being mapped.
  rpc AcquireMounts(AcquireMountsRequest) returns (AcquireMountsResponse);
  // GetWorkspaceView lists one directory of a Work Directory as its sandbox
  // sees it, with each Directory mounted inside it shown where Agent placed
  // it.
  rpc GetWorkspaceView(GetWorkspaceViewRequest) returns (GetWorkspaceViewResponse);
  // GetWorkspaceFilePreview tells how one workspace file is shown, with a
  // link for one inline read when bytes are shown. Workspace files have no
  // Preview Copies; a file Storage wrote into a mounted Directory is read as
  // that file.
  rpc GetWorkspaceFilePreview(GetWorkspaceFilePreviewRequest) returns (GetWorkspaceFilePreviewResponse);
  // IssueWorkspaceFileLink issues a short-lived link to download one
  // workspace file under its own name.
  rpc IssueWorkspaceFileLink(IssueWorkspaceFileLinkRequest) returns (IssueWorkspaceFileLinkResponse);
  // RequestWorkReclamation accepts the reclamation of every Directory whose
  // owner names a closed Work and whose lifetime is that Work's; Storage
  // removes their content once publications copying from them finish.
  // Repeating it changes nothing.
  rpc RequestWorkReclamation(RequestWorkReclamationRequest) returns (RequestWorkReclamationResponse);
  // JudgeFilePreview tells how a workspace file Storage does not hold is
  // shown, judged from its name, size and leading bytes as a Session
  // Workspace file is, under Storage's preview limits. Storage keeps nothing
  // and links nothing; the caller serves the bytes.
  rpc JudgeFilePreview(JudgeFilePreviewRequest) returns (JudgeFilePreviewResponse);
}

// MountRequest is one located Directory a Work's sandbox mounts.
message MountRequest {
  // The Directory with the backend and lifetime of its first allocation.
  LocatedDirectory directory = 1;
  // True to mount it read-only; false read-write.
  bool read_only = 2;
  // Clean relative paths inside the Directory where Agent mounts other
  // Directories; each is prepared, with every parent, owned by the sandbox
  // user.
  repeated string mount_points = 3;
}

// AcquireMountsRequest names the Directories of one Work's located layout.
message AcquireMountsRequest {
  // The Work whose sandbox mounts them.
  string work_id = 1;
  // The Directories, each once.
  repeated MountRequest mounts = 2;
}

// MountGrant is one Directory's location and access mode, opaque to the
// caller.
message MountGrant {
  // Persistent volume claim holding the Directory.
  string claim_name = 1;
  // Path of the Directory within the claim.
  string sub_path = 2;
  // True when the Directory is mounted read-only.
  bool read_only = 3;
}

// AcquireMountsResponse returns the grants.
message AcquireMountsResponse {
  // One grant per requested Directory, in request order.
  repeated MountGrant grants = 1;
}

// MountedDirectory is a Directory mounted inside a Work Directory.
message MountedDirectory {
  // Clean relative path inside the Work Directory where it is mounted.
  string path = 1;
  // The mounted Directory.
  Directory directory = 2;
}

// WorkspaceLayout is a Work Directory as its sandbox sees it: the Directory
// and the Directories mounted inside it.
message WorkspaceLayout {
  // The Work Directory.
  Directory workspace = 1;
  // Directories mounted inside it, each at its own path.
  repeated MountedDirectory mounts = 2;
}

// GetWorkspaceViewRequest names the workspace and the directory.
message GetWorkspaceViewRequest {
  // The Work Directory and what is mounted in it.
  WorkspaceLayout layout = 1;
  // Directory relative to the Work Directory; empty for its root.
  string path = 2;
}

// WorkspaceEntryKind is what a workspace entry is.
enum WorkspaceEntryKind {
  // WORKSPACE_ENTRY_KIND_UNSPECIFIED value.
  WORKSPACE_ENTRY_KIND_UNSPECIFIED = 0;
  // A directory.
  WORKSPACE_ENTRY_KIND_DIRECTORY = 1;
  // A file.
  WORKSPACE_ENTRY_KIND_FILE = 2;
  // A symbolic link: listed, never followed or opened.
  WORKSPACE_ENTRY_KIND_LINK = 3;
}

// WorkspaceEntry is one entry of a workspace directory.
message WorkspaceEntry {
  reserved 5;
  reserved "attachment_name";
  // Name within the directory.
  string name = 1;
  // Size in bytes of a file.
  int64 size_bytes = 2;
  // Last modification.
  google.protobuf.Timestamp modified_at = 3;
  // What the entry is.
  WorkspaceEntryKind kind = 4;
  // A file Storage wrote into a mounted Directory: its position, read and
  // previewed as that file.
  FilePosition position = 6;
}

// GetWorkspaceViewResponse lists the directory's first entries by name.
message GetWorkspaceViewResponse {
  // Entries by name.
  repeated WorkspaceEntry entries = 1;
  // Entries the directory has in all; more than listed when it is capped.
  uint32 total = 2;
}

// GetWorkspaceFilePreviewRequest names the workspace file.
message GetWorkspaceFilePreviewRequest {
  // The Work Directory and what is mounted in it.
  WorkspaceLayout layout = 1;
  // File relative to the Work Directory.
  string path = 2;
}

// GetWorkspaceFilePreviewResponse is the file's preview.
message GetWorkspaceFilePreviewResponse {
  // How the file is shown.
  FilePreview preview = 1;
}

// IssueWorkspaceFileLinkRequest names the workspace file.
message IssueWorkspaceFileLinkRequest {
  // The Work Directory and what is mounted in it.
  WorkspaceLayout layout = 1;
  // File relative to the Work Directory.
  string path = 2;
}

// IssueWorkspaceFileLinkResponse carries the download link.
message IssueWorkspaceFileLinkResponse {
  // URL for one download, at the public address.
  string access_url = 1;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

// RequestWorkReclamationRequest names the closed Work.
message RequestWorkReclamationRequest {
  // The closed Work.
  string work_id = 1;
}

// RequestWorkReclamationResponse confirms durable acceptance.
message RequestWorkReclamationResponse {}

// JudgeFilePreviewRequest is what a workspace file Storage does not hold
// shows of itself.
message JudgeFilePreviewRequest {
  // File name; its extension routes the judgement.
  string name = 1;
  // Size in bytes.
  int64 size_bytes = 2;
  // Leading bytes of the content, at most 8 KiB; fewer only when the file is
  // shorter.
  bytes head = 3;
}

// JudgeFilePreviewResponse is the verdict.
message JudgeFilePreviewResponse {
  // How the file is shown; it carries no link.
  FilePreview preview = 1;
  // Most bytes a reader of the shown file is served: the shown length of a
  // truncated file, otherwise its kind's limit; 0 when nothing is shown.
  int64 read_limit_bytes = 2;
}
