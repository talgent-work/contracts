syntax = "proto3";

package agent.public.v2;

import "admission/v1/admission.proto";
import "agent/public/v1/harness.proto";
import "agent/public/v1/model.proto";
import "agent/public/v1/work.proto";
import "agent/public/v1/work_start_options.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/contracts/gen/go/agent/public/v2;agentpublicv2";

// WorkService is an owner's use of their own Agent: the Standalone Works they
// start for themselves, which have no Subject and no Project, their sharing,
// and the person's Personal Library. The owner is a person or an
// Application; sharing, repository choices and the Personal Library are a
// person's alone. Every operation acts for the authenticated caller under the
// AgentDefinition Agent locates from its identity, which Agent establishes on
// its first need. The Works of a Work's
// own run, its turns and its files are AgentWorkService's and
// WorkFileService's in agent.public.v1.
service WorkService {
  // GetWorkStartOptions lists what a new Standalone Work may start with under
  // the caller's own AgentDefinition.
  rpc GetWorkStartOptions(GetWorkStartOptionsRequest) returns (GetWorkStartOptionsResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER, PRINCIPAL_APPLICATION]
    };
  }
  // ListWorkStartRepositories lists the repositories the caller may check out
  // in a new Standalone Work.
  rpc ListWorkStartRepositories(ListWorkStartRepositoriesRequest) returns (ListWorkStartRepositoriesResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER]
    };
  }
  // StartWork starts a new Standalone Work with its own File Spaces and admits
  // its first input. A repeated request identity returns the Work it started.
  rpc StartWork(StartWorkRequest) returns (StartWorkResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER, PRINCIPAL_APPLICATION]
    };
  }
  // ListWorks lists the caller's Standalone Works, closed ones included, most
  // recently updated first.
  rpc ListWorks(ListWorksRequest) returns (ListWorksResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER, PRINCIPAL_APPLICATION]
    };
  }
  // ChangeWorkTitle replaces a Standalone Work's display title.
  rpc ChangeWorkTitle(ChangeWorkTitleRequest) returns (ChangeWorkTitleResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER, PRINCIPAL_APPLICATION]
    };
  }
  // SearchShareReaders finds people in the User Directory a Standalone Work
  // may be shared with.
  rpc SearchShareReaders(SearchShareReadersRequest) returns (SearchShareReadersResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER]
    };
  }
  // GetShareReaders shows the people in the User Directory by identity.
  rpc GetShareReaders(GetShareReadersRequest) returns (GetShareReadersResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER]
    };
  }
  // GrantWorkShare lets one person in the User Directory read a Standalone
  // Work, which stays private.
  rpc GrantWorkShare(GrantWorkShareRequest) returns (GrantWorkShareResponse) {
    option (admission.v1.admits) = {
      principals: [PRINCIPAL_USER]
    };
  }
  // ListLibraryFiles is the person's Personal Library: the Artifacts of their
  // Standalone Works and of the Works they hold a Work Share in, closed ones
  // included, drawn from the 500 most recently updated of those Works.
  rpc ListLibraryFiles(ListLibraryFilesRequest) returns (ListLibraryFilesResponse) {
    option (admission.v1.admits) = {
      principals: [
        PRINCIPAL_USER,
        PRINCIPAL_AGENT
      ]
    };
  }
}

// GetWorkStartOptionsRequest is the authenticated caller's.
message GetWorkStartOptionsRequest {}

// GetWorkStartOptionsResponse is what a new Standalone Work may start with.
message GetWorkStartOptionsResponse {
  // The options.
  agent.public.v1.GetWorkStartOptionsResponse options = 1;
}

// ListWorkStartRepositoriesRequest is the authenticated caller's.
message ListWorkStartRepositoriesRequest {}

// ListWorkStartRepositoriesResponse lists the repositories.
message ListWorkStartRepositoriesResponse {
  // The repositories.
  agent.public.v1.WorkStartRepositories repositories = 1;
}

// StartWorkRequest is a new Standalone Work and its first input.
message StartWorkRequest {
  // Caller-chosen UUID identifying this start; repeating it returns its Work.
  string request_id = 1;
  // The first input, from which the display title starts.
  string initial_message = 2;
  // Optional repository checkouts.
  repeated agent.public.v1.RepositorySelection repository_selections = 3;
  // Creation-only differences from the caller's AgentDefinition.
  agent.public.v1.CreationCapabilities creation_capabilities = 4;
  // Model captured once; absence selects the machine's Claude login on a
  // Managed Computer and the first provided Model Configuration elsewhere.
  agent.public.v1.WorkModelSelection model = 5;
  // Initial Harness effort setting; empty uses its deployment default.
  string thinking_level = 6;
  // The Computer the Work runs on for its life: a Cloud or one of the
  // caller's own Managed Computers; empty runs it on the first Cloud.
  string computer_id = 7;
  // The Harness choices, admitted only on a Managed Computer.
  agent.public.v1.HarnessChoice harness = 8;
  // The Application's own MCP endpoints for this Work only, admitted only
  // when an Application starts the Work; at most 16, with names unique among
  // them and the Work's Connectors.
  repeated ApplicationMcpEndpoint application_mcp_endpoints = 9;
  // Work Labels: key=value pairs the starter defines, fixed for the Work's
  // life and used only to filter Works, break usage down and attribute
  // traces, never to grant or limit access. At most 16 pairs; a key is 1 to
  // 64 characters of letters, digits, '.', '_', '-' and '/', starting with a
  // letter or digit; a value is 1 to 256 characters on one line, without
  // surrounding whitespace. A malformed label is InvalidArgument.
  map<string, string> labels = 10;
}

// ApplicationMcpEndpoint is one of the Application's own MCP servers that a
// Work it starts calls over streamable HTTP. It never enters the Connector
// catalog and no other Work sees it. The Work sends the headers unchanged for
// its whole life: the Application keeps them valid and revokes them itself;
// nothing in the Work renews them, and no read of the Work returns them.
message ApplicationMcpEndpoint {
  // Server name the Agent sees: a letter or digit, then letters, digits,
  // '-' or '_', at most 64 characters.
  string name = 1;
  // Absolute http or https URL without credentials, at most 2048 characters.
  string url = 2;
  // Request headers sent with every call, at most 32; each name is an HTTP
  // header token of at most 128 characters and each value at most 8192.
  map<string, string> headers = 3;
}

// StartWorkResponse identifies the started Work; its readiness is observed
// through agent.public.v1.AgentWorkService.
message StartWorkResponse {
  // The Standalone Work.
  string work_id = 1;
}

// ListWorksRequest pages the caller's Standalone Works.
message ListWorksRequest {
  // At most this many, 1 to 100; zero means 50.
  uint32 limit = 1;
  // Only Works carrying every one of these Work Labels; empty lists them
  // regardless of labels.
  map<string, string> labels = 2;
  // Only Works in one of these Work States, as WorkSummary.state names them
  // ("starting", "working", "stopping", "stopped", "failed", "closing",
  // "closed"); empty lists every state. An unknown state is InvalidArgument.
  repeated string states = 3;
}

// WorkSummary is one Standalone Work as its owner's list shows it.
message WorkSummary {
  // The Work.
  string work_id = 1;
  // Its display title.
  string title = 2;
  // Its Work State.
  string state = 3;
  // Its Turn waits for the owner's answer.
  bool waiting = 4;
  // When it was started.
  google.protobuf.Timestamp created_at = 5;
  // When it last changed.
  google.protobuf.Timestamp updated_at = 6;
  // The origin of its current Disconnection; absent while it is observed.
  google.protobuf.Timestamp disconnected_since = 7;
  // Why it stopped, when it is Stopped: "disconnected" after its Computer
  // stayed unreachable past the Disconnection timeout.
  string state_reason = 8;
  // Its Work Labels, fixed when it was started.
  map<string, string> labels = 9;
}

// ListWorksResponse lists the Standalone Works, most recently updated first.
message ListWorksResponse {
  // The Works.
  repeated WorkSummary works = 1;
}

// ChangeWorkTitleRequest names the Work and its new title.
message ChangeWorkTitleRequest {
  // The owner's Standalone Work.
  string work_id = 1;
  // New title, 1 to 200 characters on one line.
  string title = 2;
}

// ChangeWorkTitleResponse confirms the title.
message ChangeWorkTitleResponse {
  // The title now shown.
  string title = 1;
}

// DirectoryUser is one person in the User Directory.
message DirectoryUser {
  // Account identity.
  string user_id = 1;
  // Login handle.
  string username = 2;
  // Display name.
  string display_name = 3;
  // Avatar image URL.
  string avatar_url = 4;
}

// SearchShareReadersRequest searches the User Directory.
message SearchShareReadersRequest {
  // Part of a username.
  string query = 1;
  // At most this many, 1 to 20; zero means 10.
  uint32 limit = 2;
}

// SearchShareReadersResponse lists matching people.
message SearchShareReadersResponse {
  // The people.
  repeated DirectoryUser users = 1;
}

// GetShareReadersRequest names people by identity.
message GetShareReadersRequest {
  // Account identities, at most 100.
  repeated string user_ids = 1;
}

// GetShareReadersResponse shows the people the directory knows.
message GetShareReadersResponse {
  // The people; an unknown identity is absent.
  repeated DirectoryUser users = 1;
}

// GrantWorkShareRequest names the owner's Work and the reader.
message GrantWorkShareRequest {
  // The owner's Standalone Work.
  string work_id = 1;
  // A person in the User Directory.
  string reader_user_id = 2;
}

// GrantWorkShareResponse confirms the reader holds a Work Share.
message GrantWorkShareResponse {}

// ListLibraryFilesRequest searches and narrows the Personal Library.
message ListLibraryFilesRequest {
  // Part of a file name, case-insensitive; empty matches every file.
  string name_query = 1;
  // Only this Work's files, when set.
  string work_id = 2;
  // Only files added at or after this time, when set.
  google.protobuf.Timestamp added_after = 3;
  // Only files added before this time, when set.
  google.protobuf.Timestamp added_before = 4;
}

// LibraryFile is one Artifact in the Personal Library.
message LibraryFile {
  // The Work that published it.
  string work_id = 1;
  // That Work's display title; empty for a Work with a Project.
  string work_title = 2;
  // File name, unique within its Work's Artifacts.
  string name = 3;
  // Size in bytes.
  int64 size_bytes = 4;
  // Media type.
  string content_type = 5;
  // When it was added or last replaced.
  google.protobuf.Timestamp added_at = 6;
  // Who shared its Work with the person; empty for the person's own Work.
  string shared_by_user_id = 7;
}

// LibraryWork is one Work whose Artifacts the Personal Library holds.
message LibraryWork {
  // The Work.
  string work_id = 1;
  // Its display title; empty for a Work with a Project.
  string title = 2;
  // Who shared it with the person; empty for the person's own Work.
  string shared_by_user_id = 3;
  // Whether it is a Standalone Work, whose page lists its files; a Work with
  // a Project keeps its files in the Project's spaces.
  bool standalone = 4;
}

// ListLibraryFilesResponse lists the matching files, most recently added
// first, and every Work the Library draws from.
message ListLibraryFilesResponse {
  // The files.
  repeated LibraryFile files = 1;
  // The Works, for narrowing by Work.
  repeated LibraryWork works = 2;
}
