syntax = "proto3";

package storage.private.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/contracts/gen/go/storage/private/v1;storageprivatev1";

// DirectoryService is the File Space Command and Query Contracts, the
// Reference Space Command and Query Contracts and the Mapped View Contract
// over Storage's one kind of space, the Directory. A caller locates each
// Directory by applying a DirectoryLocator to its own facts and decides who
// may read, write or share before calling; Storage checks only the Space
// Token on writes.
service DirectoryService {
  // OpenDirectory opens a located Directory on its first need, allocating it
  // on its backend for its lifetime; repeating it returns the same Space
  // Token and completes an allocation that failed half-way. The first
  // opening fixes backend and lifetime. A reclaimed Directory refuses with
  // DIRECTORY_RECLAIMED.
  rpc OpenDirectory(OpenDirectoryRequest) returns (OpenDirectoryResponse);
  // ListFiles lists the files Storage wrote into one Directory with their
  // active Share Links; an unopened Directory lists nothing.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // ListDirectoryFiles is the Directory file query: the files Storage wrote
  // into the given Directories. The caller names only Directories whose files
  // it has authorized its reader to see.
  rpc ListDirectoryFiles(ListDirectoryFilesRequest) returns (ListDirectoryFilesResponse);
  // IssueUpload issues the link through which one file is created or
  // replaced by a person. Create refuses a taken name; Replace refuses a
  // free one.
  rpc IssueUpload(IssueUploadRequest) returns (IssueUploadResponse);
  // RenameFile moves a file and its Share Links to a free name.
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  // DeleteFile deletes a file and revokes its Share Links; deleting an absent
  // file succeeds.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // IssueAccessLink issues a short-lived link for one read of a file.
  rpc IssueAccessLink(IssueAccessLinkRequest) returns (IssueAccessLinkResponse);
  // CreateShareLink adds an unguessable Share Link to an existing file.
  rpc CreateShareLink(CreateShareLinkRequest) returns (CreateShareLinkResponse);
  // RevokeShareLinks revokes a file's active Share Links, all of them or
  // those one person created.
  rpc RevokeShareLinks(RevokeShareLinksRequest) returns (RevokeShareLinksResponse);
  // GetFilePreview tells how a file is shown, judged afresh from its current
  // content, with a link for one inline read when bytes are shown.
  rpc GetFilePreview(GetFilePreviewRequest) returns (GetFilePreviewResponse);
  // RequestFilePreview asks for the Preview Copy of the file's current
  // content when its preview mode is RENDER; a content already rendering,
  // rendered or found unrenderable is not rendered again.
  rpc RequestFilePreview(RequestFilePreviewRequest) returns (RequestFilePreviewResponse);
  // ReplaceContent makes the given files a Directory's whole content in one
  // atomic switch, and completes only once the earlier content is removed.
  // Repeating it writes the same content again. Readers, mounted ones
  // included, always see one complete current content.
  rpc ReplaceContent(ReplaceContentRequest) returns (ReplaceContentResponse);
  // ReadContent reads files of a Directory's current content by clean
  // relative path; before its first replacement it has no files.
  rpc ReadContent(ReadContentRequest) returns (ReadContentResponse);
  // MapDirectory shows a located Directory's files at a mapped path of the
  // Mapped View as the same files, never copies, and keeps them current
  // through every change Storage carries out in the Directory until the
  // mapping is removed or the Directory reclaimed. A Directory never opened
  // is opened first; one Directory may be mapped at several paths. Repeating
  // it changes nothing. Only a caller whose token has a mapping prefix is
  // admitted, and only for a path strictly beneath that prefix: otherwise it
  // refuses with MAPPING_OUTSIDE_PREFIX. A path at, inside or above another
  // mapping's path refuses with MAPPING_OVERLAPS; a Directory once granted
  // read-write with DIRECTORY_GRANTED_READ_WRITE; one not on JuiceFS with
  // BACKEND_NOT_MAPPABLE; a reclaimed one with DIRECTORY_RECLAIMED; and a
  // path that is not a mapped path with INVALID_REQUEST.
  rpc MapDirectory(MapDirectoryRequest) returns (MapDirectoryResponse);
  // UnmapDirectory removes a Directory's mapping at a mapped path with its
  // files and the folders it emptied. Removing a mapping the Directory does
  // not have at the path, or one of a Directory never opened or reclaimed,
  // changes nothing. It is admitted as MapDirectory is.
  rpc UnmapDirectory(UnmapDirectoryRequest) returns (UnmapDirectoryResponse);
}

// ErrorReason names why Storage refused a call. A refusal carries it as the
// reason of a google.rpc.ErrorInfo detail in domain "storage", beside the
// status code, so callers tell refusals with the same code apart.
enum ErrorReason {
  // No reason given.
  ERROR_REASON_UNSPECIFIED = 0;
  // No file at the position.
  ERROR_REASON_FILE_NOT_FOUND = 1;
  // No file at the publication source in the workspace.
  ERROR_REASON_SOURCE_NOT_FOUND = 2;
  // The source is not one regular Session Workspace file outside every
  // Directory mounted in it.
  ERROR_REASON_INVALID_SOURCE = 3;
  // The name is not one file name.
  ERROR_REASON_INVALID_NAME = 4;
  // The request misses a required field.
  ERROR_REASON_INVALID_REQUEST = 5;
  // A workspace path leaves the workspace.
  ERROR_REASON_INVALID_WORKSPACE_PATH = 6;
  // A file already has the name.
  ERROR_REASON_NAME_TAKEN = 7;
  // The Directory was never opened, or the Space Token names none.
  ERROR_REASON_DIRECTORY_NOT_OPEN = 8;
  // The Directory's space does not exist yet: its allocation has not
  // completed.
  ERROR_REASON_DIRECTORY_NOT_ALLOCATED = 9;
  // The Directory was reclaimed: it is never mounted, written or recreated.
  ERROR_REASON_DIRECTORY_RECLAIMED = 10;
  // The Locator is invalid: a lifetime of its Work without the work
  // condition, an owner fact repeated, or a name that is not one path
  // element.
  ERROR_REASON_INVALID_LOCATOR = 11;
  // A permanent Directory refuses reclamation.
  ERROR_REASON_PERMANENT_DIRECTORY = 12;
  // The mapped path does not lie strictly beneath the mapping prefix
  // configured for the caller, or the caller has none.
  ERROR_REASON_MAPPING_OUTSIDE_PREFIX = 13;
  // The mapped path is, lies inside or lies above another mapping's path.
  ERROR_REASON_MAPPING_OVERLAPS = 14;
  // The Directory was once granted read-write, so a Harness may have written
  // it bypassing Storage; it is never mapped.
  ERROR_REASON_DIRECTORY_GRANTED_READ_WRITE = 15;
  // The Directory is not on JuiceFS, the Mapped View's backend.
  ERROR_REASON_BACKEND_NOT_MAPPABLE = 16;
  // A read-write Mount Grant was asked for a mapped Directory, which is only
  // ever mounted read-only.
  ERROR_REASON_DIRECTORY_MAPPED = 17;
}

// Backend is where a Directory's files live, fixed at its first allocation.
enum Backend {
  // BACKEND_UNSPECIFIED value.
  BACKEND_UNSPECIFIED = 0;
  // The NAS, for Directories a Harness writes through mounts.
  BACKEND_NAS = 1;
  // JuiceFS, for Directories Storage writes and keeps as originals.
  BACKEND_JUICEFS = 2;
}

// Lifetime is how long a Directory is kept, fixed at its first allocation.
enum Lifetime {
  // LIFETIME_UNSPECIFIED value.
  LIFETIME_UNSPECIFIED = 0;
  // Reclaimed with the Work its owner names; its owner must name a Work.
  LIFETIME_WORK = 1;
  // Kept permanently; never reclaimed.
  LIFETIME_PERMANENT = 2;
}

// DirectoryLocator is the Directory Locator Contract: what a caller locates a
// Directory by. Applied to a caller's facts, with a value for each condition,
// it gives one DirectoryOwner and name; a caller lacking a value for a
// condition locates nothing and requests nothing.
message DirectoryLocator {
  // Names of the facts the Directory follows, each once, such as "file_home"
  // or "work". Storage recognizes only "work"; every other name is the
  // callers' shared vocabulary.
  repeated string conditions = 1;
  // Name of the Directory within its owner: one path element, never empty,
  // never starting with "." and never containing "/", "\" or NUL.
  string name = 2;
  // Backend it is allocated on.
  Backend backend = 3;
  // Lifetime it is allocated for.
  Lifetime lifetime = 4;
}

// OwnerFact is one condition of a Locator with the caller's value for it.
message OwnerFact {
  // The condition's name.
  string condition = 1;
  // The caller's value, opaque to Storage; for "work", the Work's identity.
  string value = 2;
}

// DirectoryOwner is a Locator's conditions with the caller's fact values,
// such as {file_home: intent:123}. Storage keeps it as supplied, in condition
// order, and interprets only whether it names a Work.
message DirectoryOwner {
  // Facts ordered by condition name, each condition once.
  repeated OwnerFact facts = 1;
}

// Directory is the identity of one Directory: its owner and name.
message Directory {
  // Owner.
  DirectoryOwner owner = 1;
  // Name within the owner.
  string name = 2;
}

// LocatedDirectory is what applying a Locator to a caller's facts gives:
// the Directory with the backend and lifetime its first allocation takes.
message LocatedDirectory {
  // The Directory.
  Directory directory = 1;
  // Backend; a later opening with another backend gets the existing
  // Directory unchanged.
  Backend backend = 2;
  // Lifetime; a later opening with another lifetime gets the existing
  // Directory unchanged.
  Lifetime lifetime = 3;
}

// FilePosition is a file's identity: its Directory and its name, one path
// element directly in the Directory.
message FilePosition {
  // The Directory.
  Directory directory = 1;
  // File name.
  string name = 2;
}

// AccessDisposition says how an Access Link presents the file.
enum AccessDisposition {
  // ACCESS_DISPOSITION_UNSPECIFIED value.
  ACCESS_DISPOSITION_UNSPECIFIED = 0;
  // Downloads the file under its name.
  ACCESS_DISPOSITION_DOWNLOAD = 1;
  // Shows the file inline for preview.
  ACCESS_DISPOSITION_PREVIEW = 2;
}

// ShareLink is one active Share Link to a file.
message ShareLink {
  // Unguessable token naming the link.
  string token = 1;
  // URL through which anyone holding it reads the file.
  string url = 2;
  // The person the owner's context named when creating it; empty when it
  // named an Application.
  string created_by_user_id = 3;
  // Creation time.
  google.protobuf.Timestamp created_at = 4;
  // The Application the owner's context named when creating it; empty when
  // it named a person.
  string created_by_application_id = 5;
}

// File is one Attachment or Artifact at its File position: an Attachment
// names its uploader, an Artifact the Work that published it.
message File {
  reserved 2, 3;
  reserved "kind", "name";
  // Position: Directory and name.
  FilePosition position = 1;
  // Size in bytes.
  int64 size_bytes = 4;
  // Media type: the uploaded type, or the one of the name's extension.
  string content_type = 5;
  // Last time the content changed.
  google.protobuf.Timestamp updated_at = 6;
  // Human who uploaded an Attachment.
  string uploader_user_id = 7;
  // Work that published an Artifact.
  string work_id = 8;
  // Active Share Links.
  repeated ShareLink share_links = 9;
  // Application that uploaded an Attachment.
  string uploader_application_id = 10;
}

// OpenDirectoryRequest names the located Directory.
message OpenDirectoryRequest {
  // The Directory with the backend and lifetime of its first allocation.
  LocatedDirectory directory = 1;
}

// OpenDirectoryResponse carries the Directory's credential.
message OpenDirectoryResponse {
  // Credential every file command and content replacement presents.
  string space_token = 1;
}

// ListFilesRequest names a Directory.
message ListFilesRequest {
  // The Directory.
  Directory directory = 1;
}

// ListFilesResponse lists the files by name.
message ListFilesResponse {
  // Files Storage wrote into the Directory.
  repeated File files = 1;
}

// ListDirectoryFilesRequest names the Directories.
message ListDirectoryFilesRequest {
  // Directories; one never opened has no files. At most 1000.
  repeated Directory directories = 1;
}

// ListDirectoryFilesResponse lists the Directories' files, by Directory as
// requested, then by name. Share Links are not included.
message ListDirectoryFilesResponse {
  // Files of the Directories.
  repeated File files = 1;
  // The requested Directories that were reclaimed, as requested; they list
  // no files, unlike one never opened, which is simply absent.
  repeated Directory reclaimed = 2;
}

// IssueUploadRequest describes the intended write.
message IssueUploadRequest {
  // Where the file is written.
  FilePosition position = 1;
  // The Directory's credential.
  string space_token = 2;
  // True to replace the file at the position; false to create a new one.
  bool replace = 3;
  // Person the upload is attributed to; exactly one of uploader_user_id and
  // uploader_application_id is set.
  string uploader_user_id = 4;
  // Declared media type, kept with the file.
  string content_type = 5;
  // Application the upload is attributed to.
  string uploader_application_id = 6;
}

// IssueUploadResponse carries the upload link.
message IssueUploadResponse {
  // URL to PUT the content to.
  string upload_url = 1;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
}

// RenameFileRequest names the file and its new name.
message RenameFileRequest {
  // The file.
  FilePosition position = 1;
  // The Directory's credential.
  string space_token = 2;
  // New name in the same Directory; it must be free.
  string new_name = 3;
  // The person renaming it, admitted by the owner's context; exactly one of
  // actor_user_id and actor_application_id is set.
  string actor_user_id = 4;
  // The Application renaming it, admitted by the owner's context.
  string actor_application_id = 5;
}

// RenameFileResponse returns the renamed file.
message RenameFileResponse {
  // The file at its new position.
  File file = 1;
}

// DeleteFileRequest names the file.
message DeleteFileRequest {
  // The file.
  FilePosition position = 1;
  // The Directory's credential.
  string space_token = 2;
  // The person deleting it, admitted by the owner's context; exactly one of
  // actor_user_id and actor_application_id is set.
  string actor_user_id = 3;
  // The Application deleting it, admitted by the owner's context.
  string actor_application_id = 4;
}

// DeleteFileResponse confirms the file is gone.
message DeleteFileResponse {}

// IssueAccessLinkRequest names the file to read.
message IssueAccessLinkRequest {
  // The file.
  FilePosition position = 1;
  // How the link presents the file.
  AccessDisposition disposition = 2;
}

// IssueAccessLinkResponse carries the link.
message IssueAccessLinkResponse {
  // URL for one read, at the public address.
  string access_url = 1;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 2;
  // The same link as a path, which a Work resolves against the public
  // gateway's origin.
  string access_path = 3;
}

// GetFilePreviewRequest names the file.
message GetFilePreviewRequest {
  // The file.
  FilePosition position = 1;
}

// GetFilePreviewResponse is the file's preview.
message GetFilePreviewResponse {
  // How the file is shown.
  FilePreview preview = 1;
}

// RequestFilePreviewRequest names the file.
message RequestFilePreviewRequest {
  // The file.
  FilePosition position = 1;
}

// RequestFilePreviewResponse is the file's preview after the request.
message RequestFilePreviewResponse {
  // How the file is shown.
  FilePreview preview = 1;
}

// ContentFile is one file of a Directory's whole content.
message ContentFile {
  // Clean relative path within the content, such as "pages/payments.md";
  // any other path is refused as invalid. A path whose first element is
  // hidden is kept for the writer and left out of a mounted listing.
  string path = 1;
  // File content.
  bytes content = 2;
}

// ReplaceContentRequest is a Directory's whole new content.
message ReplaceContentRequest {
  // The Directory.
  Directory directory = 1;
  // The Directory's credential.
  string space_token = 2;
  // Every file of the new content.
  repeated ContentFile files = 3;
}

// ReplaceContentResponse acknowledges the replacement.
message ReplaceContentResponse {}

// ReadContentRequest names the Directory and the files wanted.
message ReadContentRequest {
  // The Directory.
  Directory directory = 1;
  // Paths to read; empty reads every file.
  repeated string paths = 2;
}

// ReadContentResponse is the files found among those asked for.
message ReadContentResponse {
  // The files of the current content.
  repeated ContentFile files = 1;
}

// MapDirectoryRequest names the located Directory and where it is shown.
message MapDirectoryRequest {
  // The Directory with the backend and lifetime of its first allocation.
  LocatedDirectory directory = 1;
  // Mapped path: a clean relative path of "/"-separated elements, each
  // non-empty, never "." or "..", never starting with "." and never
  // containing "\" or NUL, beneath the caller's mapping prefix. Storage never
  // interprets it.
  string path = 2;
}

// MapDirectoryResponse acknowledges the mapping.
message MapDirectoryResponse {}

// UnmapDirectoryRequest names the Directory and the mapping removed.
message UnmapDirectoryRequest {
  // The Directory.
  Directory directory = 1;
  // Mapped path the Directory was mapped at, beneath the caller's mapping
  // prefix.
  string path = 2;
}

// UnmapDirectoryResponse acknowledges the removal.
message UnmapDirectoryResponse {}

// PreviewMode is how a file is shown.
enum PreviewMode {
  // PREVIEW_MODE_UNSPECIFIED value.
  PREVIEW_MODE_UNSPECIFIED = 0;
  // Not shown; refusal says why. The original still downloads.
  PREVIEW_MODE_REFUSED = 1;
  // The content's Preview Copy is shown.
  PREVIEW_MODE_PREVIEW_COPY = 2;
  // A Preview Copy must be rendered first.
  PREVIEW_MODE_RENDER = 3;
  // The file is shown as it is.
  PREVIEW_MODE_DIRECT = 4;
  // The first limit_bytes of the file are shown as text.
  PREVIEW_MODE_TRUNCATED = 5;
}

// PreviewDisplay is what the shown bytes are.
enum PreviewDisplay {
  // Nothing is shown.
  PREVIEW_DISPLAY_UNSPECIFIED = 0;
  // UTF-8 text, rendered by the file's extension.
  PREVIEW_DISPLAY_TEXT = 1;
  // A PDF: a native one or a Preview Copy.
  PREVIEW_DISPLAY_PDF = 2;
  // An image.
  PREVIEW_DISPLAY_IMAGE = 3;
}

// PreviewRefusal is why a file is not shown, as a reader can recognize it.
enum PreviewRefusal {
  // Not refused.
  PREVIEW_REFUSAL_UNSPECIFIED = 0;
  // No preview exists for this kind of file.
  PREVIEW_REFUSAL_UNSUPPORTED = 1;
  // The content is not what the file extension says.
  PREVIEW_REFUSAL_STRUCTURE_MISMATCH = 2;
  // The file is encrypted.
  PREVIEW_REFUSAL_ENCRYPTED = 3;
  // The file is over limit_bytes, its kind's preview limit.
  PREVIEW_REFUSAL_TOO_LARGE = 4;
  // The converter found the content damaged.
  PREVIEW_REFUSAL_CORRUPT = 5;
  // The converter refused the content.
  PREVIEW_REFUSAL_CONVERTER_REFUSED = 6;
  // The rendering came out over its limit.
  PREVIEW_REFUSAL_RENDERING_TOO_LARGE = 7;
}

// FilePreview is how one file is shown.
message FilePreview {
  // Mode.
  PreviewMode mode = 1;
  // What the shown bytes are.
  PreviewDisplay display = 2;
  // Why a refused file is not shown.
  PreviewRefusal refusal = 3;
  // Shown length of a truncated file, or the limit a too large file exceeds.
  int64 limit_bytes = 4;
  // URL for one inline read of the shown bytes; empty when none are shown.
  string access_url = 5;
  // The same link as a path.
  string access_path = 6;
  // Time the link stops working.
  google.protobuf.Timestamp expires_at = 7;
  // With mode RENDER: a rendering of the content is queued or running.
  bool rendering = 8;
}

// CreateShareLinkRequest names the file and its sharer, exactly one person or
// one Application the owner's context admitted.
message CreateShareLinkRequest {
  // The file.
  FilePosition position = 1;
  // The person sharing it.
  string created_by_user_id = 2;
  // The Application sharing it.
  string created_by_application_id = 3;
}

// CreateShareLinkResponse returns the new link.
message CreateShareLinkResponse {
  // The active Share Link.
  ShareLink share_link = 1;
}

// RevokeShareLinksRequest names the file and whose links end: the links one
// person or one Application created, or, naming neither, every link.
message RevokeShareLinksRequest {
  // The file.
  FilePosition position = 1;
  // Only the links this person created end.
  string created_by_user_id = 2;
  // Only the links this Application created end.
  string created_by_application_id = 3;
}

// RevokeShareLinksResponse reports what ended and what stays active.
message RevokeShareLinksResponse {
  // Links revoked now.
  int32 revoked = 1;
  // Active links left at the file.
  int32 remaining = 2;
}
