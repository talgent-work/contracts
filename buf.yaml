version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  # Stable packages (vN) keep binary and JSON wire compatibility (README.md,
  # Compatibility); vNalphaM and vNbetaM may change.
  use:
    - WIRE_JSON
  ignore_unstable_packages: true
