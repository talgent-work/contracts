syntax = "proto3";

package account.private.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/talgent-work/contracts/gen/go/account/private/v1;accountprivatev1";

// AgentAccountService keeps one Agent Account per Work and issues the Work's
// agent Identity Token. Only Agent calls it, inside the cluster; it is never
// mounted through the public gateway. Account copies the supplied facts into
// the token and decides nothing from them.
service AgentAccountService {
  // IssueWorkIdentityToken issues a Work's agent Identity Token. The first
  // request for a Work creates its Agent Account with the supplied facts; a
  // later request whose facts differ is FailedPrecondition. The token is
  // never refreshed: each request issues a new one.
  rpc IssueWorkIdentityToken(IssueWorkIdentityTokenRequest) returns (IssueWorkIdentityTokenResponse);
}

// IssueWorkIdentityTokenRequest names a Work and its fixed facts, all fixed
// when the Work was created.
message IssueWorkIdentityTokenRequest {
  // The Work, a canonical lowercase UUID; the token's subject.
  string work_id = 1;
  reserved 2, 5, 6;
  reserved "project_id", "work_subject_kind", "work_subject_id";
  // The Work's AgentDefinition.
  string agent_id = 3;
  // The purpose of the Work's AgentDefinition.
  string purpose = 4;
  // The Account id of the person the Agent represents; empty for an Agent
  // that represents no one, such as the PM Coordinator.
  string represented_user_id = 7;
  // The Application that owns the Work, a canonical lowercase UUID; empty for
  // a Work no Application owns. Such a Work represents no person.
  string application_id = 8;
  // The Work's Work Labels, which its starter defined: at most 16 pairs, keys
  // of at most 64 characters and values of at most 256.
  map<string, string> work_labels = 9;
  // The kind of the Work's Work Caller, in whose name it was started, such as
  // "person", "application" or "project"; required.
  string work_caller_kind = 10;
  // The identity of the Work's Work Caller; required.
  string work_caller_id = 11;
  // The kind of the Work's Work Key; empty, with work_key_id, for a Work
  // without one.
  string work_key_kind = 12;
  // The identity of the Work's Work Key.
  string work_key_id = 13;
  // The kind of the Work's File Home; empty, with file_home_id, for a Work
  // without one.
  string file_home_kind = 14;
  // The identity of the Work's File Home.
  string file_home_id = 15;
}

// IssueWorkIdentityTokenResponse is the signed token and its expiry.
message IssueWorkIdentityTokenResponse {
  // The signed agent Identity Token. It is a credential: never log it.
  string token = 1;
  // When the token expires.
  google.protobuf.Timestamp expires_at = 2;
}
