syntax = "proto3";

package agent.private.v1;

option go_package = "github.com/talgent-work/contracts/gen/go/agent/private/v1;agentprivatev1";

// ActingWorkService tells a trusted context whether a Work may act now, which
// it asks before it admits a write of the Work's Agent (Acting check). Agent
// decides it from the Work's own state; a read needs no such question.
service ActingWorkService {
  // AdmitAgentAction answers OK while the Work is Working and awaits no
  // required response from its person, waiting briefly for a delivered reply
  // to resolve. A Work that may not act now is FailedPrecondition; an unknown
  // Work is NotFound.
  rpc AdmitAgentAction(AdmitAgentActionRequest) returns (AdmitAgentActionResponse);
}

// AdmitAgentActionRequest names the Work whose Agent wants to act.
message AdmitAgentActionRequest {
  // The Work, as the caller's agent identity names it.
  string work_id = 1;
}

// AdmitAgentActionResponse admits the action.
message AdmitAgentActionResponse {}
